{% extends "base.html" %}
{% block content %}
<section class="contact-page">
  <div class="auth-form-block">
    <span class="eyebrow">Order Placed</span>
    <h1 class="contact-page-title">Thank You!</h1>
    <p class="order-confirmation-text">Your order #{{ order.id }} has been placed and will be paid via Cash on Delivery. We will contact you at {{ order.phone }} to confirm details.</p>
    <a href="{% url 'shop-all' %}" class="btn-primary">Continue Shopping</a>
  </div>
</section>
{% endblock %}
