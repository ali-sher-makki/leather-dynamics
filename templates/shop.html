{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="shop-page">
  <div class="shop-page-header">
    <span class="eyebrow">Browse by Category</span>
    <h1 class="shop-page-title">Our Categories</h1>
  </div>
  <div class="category-grid">
    {% for category in categories %}
    <a href="{% url 'shop-category' category.id %}" class="category-card">
      <div class="category-card-image" {% if category.image %}style="background-image:url('{{ category.image.url }}');background-size:cover;background-position:center;"{% endif %}></div>
      <h3>{{ category.name }}</h3>
    </a>
    {% empty %}
    <p class="shop-empty">Categories coming soon.</p>
    {% endfor %}
  </div>
  <div class="shop-viewall">
    <a href="{% url 'shop-all' %}" class="btn-primary">Browse All Products</a>
  </div>
</section>
{% endblock %}
