{% extends "base.html" %}
{% block content %}
<section class="contact-page">
  <div class="auth-form-block">
    <span class="eyebrow">Create Account</span>
    <h1 class="contact-page-title">Register</h1>
    <form method="post" class="contact-form">
      {% csrf_token %}
      {% for field in form %}
        {{ field }}
        {% if field.errors %}<p class="form-status error">{{ field.errors|striptags }}</p>{% endif %}
      {% endfor %}
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</section>
{% endblock %}
